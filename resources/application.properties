# 服务器配置
server.port=8080

# 数据库配置（MySQL 8.0+）
spring.datasource.url=jdbc:mysql://localhost:3306/wealthwave?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456  # 替换为你的数据库密码
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate配置
spring.jpa.hibernate.ddl-auto=update  # 自动创建/更新数据库表
spring.jpa.show-sql=true  # 打印SQL语句
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true  # 格式化SQL语句